mailbox:
  account: "wenli.insight@gmail.com"
  sender: "wenli.insight@gmail.com"
  recipient: "wenli.insight@gmail.com"
  subject: "Weekly Clean Fuel Programs Update | {period}"

schedule:
  timezone: "America/Regina"
  # The program always summarizes the last completed Friday 00:00 through
  # Friday 00:00 window, i.e. Friday through Thursday inclusive.
  weekday: "Friday"
  time: "09:00"

ai:
  # Low-cost OpenAI model suited to classification and summarization.
  model: "gpt-5-nano"
  summary_language: "English"
  max_email_characters: 30000
  retry_attempts: 3
  request_timeout_seconds: 90
  # Keep the whole application below Task Scheduler's 60-minute limit.
  run_timeout_seconds: 3300

paths:
  gmail_credentials: "runtime/secrets/credentials.json"
  gmail_token: "runtime/secrets/token.json"
  state_file: "runtime/state/state.json"
  log_file: "runtime/logs/weekly_digest.log"
  preview_directory: "runtime/output"
  log_max_bytes: 5000000
  log_backup_count: 5

integrations:
  # Optional interface to digest files produced by other regulatory programs.
  # Set to false to run the Gmail-only core workflow.
  local_digest_enabled: true

alerts:
  # How a failed weekly run, or a week with no delivery at all, reaches a human.
  # These channels deliberately avoid the mail transport: a Gmail problem must
  # not be able to hide itself.
  # Popup: msg.exe when present, otherwise a PowerShell message box. Verified on
  # the production machine, where msg.exe is not installed.
  popup_enabled: true
  # Desktop marker: a date-stamped file that stays until deleted. This is the
  # channel that survives a closed session, so keep it enabled.
  desktop_marker_enabled: true
  # Event log: eventcreate.exe exists but returns "Access is denied" unless the
  # task runs elevated. Disabled on purpose: a channel that cannot deliver is
  # worse than no channel. Enable it only for an elevated deployment.
  event_log_enabled: false
  # Hours after the scheduled Friday 09:00 send time before the watchdog reports
  # the period as missing. Six hours means the alert arrives Friday afternoon.
  grace_hours: 6
  # Earliest period end (YYYY-MM-DD) the watchdog must treat as "should have been
  # delivered" even when no send history exists at all, for example after the
  # state file is lost. Without it a watchdog with no history stays silent.
  watchdog_armed_from: "2026-10-09"

local_digest_sources:
  - id: "california_lcfs_digest_input"
    program_id: "california_lcfs"
    directory: "D:/WorkSpace/Code/RegProgram_Automation/program/CA_LCFS/digest_input"
    pattern: "*.json"
    timestamp_field: "generated_at"
    json_program: "CA_LCFS"
    display_label: "Newly Certified Pathways"
    public_source_url: "https://ww2.arb.ca.gov/sites/default/files/classic/fuels/lcfs/fuelpathways/current-pathways_all.xlsx"
  - id: "bc_lcfs_digest_input"
    program_id: "bc_lcfs"
    directory: "D:/WorkSpace/Code/RegProgram_Automation/program/BC_LCFS/digest_input"
    pattern: "*.json"
    timestamp_field: "generated_at"
    json_program: "BC_LCFS"
    display_label: "Guidance Updates"

programs:
  - id: "california_lcfs"
    country: "United States"
    country_order: 1
    program_order: 1
    name: "California Low Carbon Fuel Standard (LCFS)"
    sender: "carb@public.govdelivery.com"
    mixed_topic: true
    include_terms:
      - "California Low Carbon Fuel Standard"
      - "LCFS"
      - "LCFS regulation"
      - "LCFS pathway"
      - "LCFS credit"
      - "carbon intensity pathway"
    exclude_terms:
      - "Cap-and-Trade"
      - "Advanced Clean Cars"
      - "ZEV"
      - "general air quality"

  - id: "oregon_cfp"
    country: "United States"
